name: Spedition Stage 2 inventory existing artifacts

on:
  push:
    paths:
      - '.github/workflows/spedition-stage2-recover-existing-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory recent relevant artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          arts=[]
          for page in range(1,30):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}',headers=h)
              with urllib.request.urlopen(req) as r:d=json.load(r)
              batch=d.get('artifacts',[]); arts.extend(batch)
              if len(batch)<100:break
          rel=[]
          for a in arts:
              s=(a.get('name') or '').lower()
              if any(x in s for x in ('spedition','stage2','recheck','agent','spediteur')):
                  rel.append({k:a.get(k) for k in ('id','name','size_in_bytes','created_at','updated_at','expired','workflow_run')})
          rel.sort(key=lambda x:x.get('created_at',''),reverse=True)
          p=pathlib.Path('data/spedition/stage2_agent_final/artifact_inventory.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'total_artifacts_seen':len(arts),'relevant':rel},ensure_ascii=False,indent=2),encoding='utf-8')
          print(p.read_text())
          PY
      - name: Persist inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spedition/stage2_agent_final/artifact_inventory.json
          git commit -m 'Persist Stage 2 artifact inventory' || exit 0
          for n in 1 2 3 4; do
            git pull --rebase origin main || { git rebase --abort || true; }
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
