name: Accounting Stage 2.5 agent verification

on:
  push:
    paths:
      - '.github/workflows/accounting-stage2-agent-verify.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download existing KSW qualification checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source agent_input
          gh api repos/${{ github.repository }}/actions/artifacts/9731550965/zip > /tmp/ksw-qualified.zip
          unzip -o /tmp/ksw-qualified.zip -d source
          test -f source/ksw_all_groups_qualified.csv
      - name: Build Stage 2.5 agent batches
        run: |
          python scripts/accounting_stage2_agent_prepare.py \
            --input source/ksw_all_groups_qualified.csv \
            --output-dir agent_input \
            --chunks 32
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-stage2-agent-input
          path: agent_input/*
          retention-days: 30
