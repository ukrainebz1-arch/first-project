name: Prepare Hausverwaltung Stage2 agent ledger
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hv-stage2-agent-prep.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact review ledger
        run: |
          python - <<'PY'
          import csv, os, json
          src='data/hausverwaltung/size_strict_v2/manual_review_queue_v2.csv'
          outdir='data/hausverwaltung/size_agent_first'
          os.makedirs(outdir, exist_ok=True)
          rows=list(csv.DictReader(open(src,encoding='utf-8-sig',newline='')))
          fields=['no','company_name','strict_class','standort_count','states_seen','website','karriere_exact','karriere_min','karriere_max','direct31','group31','borderline','adjacent_hint','strict_evidence_short']
          with open(f'{outdir}/review_ledger.tsv','w',encoding='utf-8',newline='') as f:
              f.write('\t'.join(fields)+'\n')
              for i,r in enumerate(rows,1):
                  ev=(r.get('strict_evidence_v2') or r.get('strict_evidence') or '').replace('\t',' ').replace('\r',' ').replace('\n',' ')
                  vals=[str(i),r.get('company_name',''),r.get('size_class_strict_v2',''),r.get('wko_standort_count',''),r.get('states_seen',''),r.get('website',''),r.get('karriere_exact_match',''),r.get('karriere_emp_min',''),r.get('karriere_emp_max',''),r.get('direct_31plus_sources_v2',''),r.get('group_31plus_sources_v2',''),r.get('borderline_sources_v2',''),r.get('adjacent_non_core_hint',''),ev[:360]]
                  f.write('\t'.join(v.replace('\t',' ') for v in vals)+'\n')
          counts={}
          for r in rows: counts[r.get('size_class_strict_v2','')]=counts.get(r.get('size_class_strict_v2',''),0)+1
          json.dump({'review_rows':len(rows),'strict_counts':counts},open(f'{outdir}/review_ledger_summary.json','w'),indent=2,ensure_ascii=False)
          print('rows',len(rows),counts)
          PY
      - name: Persist ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hausverwaltung/size_agent_first
          git commit -m 'Checkpoint Hausverwaltung Stage2 agent-first review ledger' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
