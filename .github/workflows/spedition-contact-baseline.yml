name: Spedition contact baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/spedition_contact_baseline.py'
      - '.github/workflows/spedition-contact-baseline.yml'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score existing evidence
        run: python scripts/spedition_contact_baseline.py
      - name: Persist baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spedition/contacts/baseline
          git commit -m 'Checkpoint Spedition primary-DM contact baseline' || exit 0
          for n in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort || true; git pull origin main --no-rebase || true; }
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
