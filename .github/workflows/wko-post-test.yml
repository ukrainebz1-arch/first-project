name: WKO ASP.NET postback test
on:
  push:
    paths:
      - 'test_wko_post.py'
      - '.github/workflows/wko-post-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python test_wko_post.py
