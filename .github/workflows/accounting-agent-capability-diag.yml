name: Accounting agent capability test

on:
  push:
    paths:
      - '.github/workflows/accounting-agent-capability-diag.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Test subagent plus web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Use the task tool to launch one general-purpose subagent. The subagent must research IWTH Steuerberatung in Austria on the public web, open its official team page, and determine whether the official site supports at least 50 staff. After the subagent reports back, reply with exactly SUBAGENT_WEB_OK if it successfully used web evidence; otherwise reply FAILED. Do not modify files or run shell commands." \
            -s --no-ask-user --allow-all-urls \
            --deny-tool='shell' --deny-tool='write' > /tmp/copilot.txt
          cat /tmp/copilot.txt
          grep -q 'SUBAGENT_WEB_OK' /tmp/copilot.txt
