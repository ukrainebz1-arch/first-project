name: Accounting agent capability test

on:
  push:
    paths:
      - '.github/workflows/accounting-agent-capability-diag.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python research dependencies
        run: pip install requests beautifulsoup4
      - name: Download Stage 2 checkpoint and make IWTH test input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source agent_input test_out
          gh api repos/${{ github.repository }}/actions/artifacts/9731550965/zip > /tmp/ksw.zip
          unzip -o /tmp/ksw.zip -d source >/dev/null
          python scripts/accounting_stage2_agent_prepare.py --input source/ksw_all_groups_qualified.csv --output-dir agent_input --chunks 1
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('agent_input/candidate_universe.csv',encoding='utf-8-sig')))
          hit=[r for r in rows if r['group_key']=='domain:iwth.at']
          assert len(hit)==1, len(hit)
          with open('agent_input/iwth.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(hit[0].keys()));w.writeheader();w.writerows(hit)
          PY
      - name: Install Ollama and Qwen
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          pkill ollama || true
          OLLAMA_CONTEXT_LENGTH=8192 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull qwen3:4b-instruct
      - name: Run optimized local research agent on IWTH
        run: |
          python scripts/accounting_stage2_local_agent_worker.py \
            --input-csv agent_input/iwth.csv \
            --output-jsonl test_out/iwth.jsonl \
            --model qwen3:4b-instruct
          cat test_out/iwth.jsonl
      - name: Deterministic gate
        run: python scripts/accounting_stage2_agent_validate.py chunk --input-csv agent_input/iwth.csv --result-jsonl test_out/iwth.jsonl
