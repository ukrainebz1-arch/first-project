name: Accounting agent capability test

on:
  push:
    paths:
      - '.github/workflows/accounting-agent-capability-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Install Ollama and local Qwen agent model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          pkill ollama || true
          OLLAMA_CONTEXT_LENGTH=32768 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull qwen3:4b-instruct
          cat > /tmp/Modelfile <<'EOF'
          FROM qwen3:4b-instruct
          PARAMETER num_ctx 32768
          EOF
          ollama create accounting-agent -f /tmp/Modelfile
          curl -fsS http://127.0.0.1:11434/v1/models | grep -q 'accounting-agent'
      - name: Test local-model subagent plus web
        env:
          COPILOT_PROVIDER_BASE_URL: http://127.0.0.1:11434/v1
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_PROVIDER_API_KEY: ollama
          COPILOT_MODEL: accounting-agent
        run: |
          copilot -p "Use the task tool to launch one general-purpose subagent. The subagent must research IWTH Steuerberatung in Austria on the public web, open its official team page, and determine whether the official site supports at least 50 staff. After the subagent reports back, reply with exactly LOCAL_SUBAGENT_WEB_OK if it successfully used public web evidence; otherwise reply FAILED. Do not modify files or run shell commands." \
            -s --no-ask-user --allow-all-urls \
            --deny-tool='shell' --deny-tool='write' > /tmp/copilot.txt
          cat /tmp/copilot.txt
          grep -q 'LOCAL_SUBAGENT_WEB_OK' /tmp/copilot.txt
