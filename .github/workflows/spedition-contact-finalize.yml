name: Spedition contact finalizer
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/spedition_contact_finalize.py'
      - '.github/workflows/spedition-contact-finalize.yml'
      - 'data/spedition/contacts/external_web_chunks/**'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build final contact outputs
        run: python scripts/spedition_contact_finalize.py
      - name: Show summary
        run: cat data/spedition/contacts/final/summary.json
      - name: Upload final CSV bundle
        uses: actions/upload-artifact@v4
        with:
          name: spedition-contact-final-csvs
          path: data/spedition/contacts/final/
          if-no-files-found: error
          retention-days: 30
      - name: Persist final CSV outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spedition/contacts/final
          git commit -m 'Finalize Spedition decision-maker contacts A-F' || exit 0
          for n in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort || true; git pull origin main --no-rebase || true; }
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
