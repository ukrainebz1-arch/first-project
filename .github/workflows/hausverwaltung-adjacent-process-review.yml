name: Hausverwaltung adjacent process review
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hausverwaltung_extract_adjacent_process_review.py'
      - '.github/workflows/hausverwaltung-adjacent-process-review.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract adjacent ledger
        run: python scripts/hausverwaltung_extract_adjacent_process_review.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hausverwaltung/size_agent_first/adjacent_process_review_input.tsv data/hausverwaltung/size_agent_first/adjacent_process_review_summary.json
          git commit -m 'Checkpoint Hausverwaltung adjacent process review input' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main