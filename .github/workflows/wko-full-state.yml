name: WKO Full Bookkeeping Austria

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wko_full_state_scraper.py'
      - '.github/workflows/wko-full-state.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests==2.32.4 beautifulsoup4==4.12.3
      - name: Scrape all states and both WKO queries
        env:
          OUT_DIR: output_full
          STATE_WORKERS: '4'
        run: python wko_full_state_scraper.py
      - name: Show summary
        if: always()
        run: |
          if [ -f output_full/summary.json ]; then cat output_full/summary.json; fi
          if [ -f output_full/scrape_errors.csv ]; then cat output_full/scrape_errors.csv; fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wko-bookkeeping-austria-full
          path: output_full/
          if-no-files-found: error
          retention-days: 7
