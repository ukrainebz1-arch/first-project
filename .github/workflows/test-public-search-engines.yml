name: Test public search engines
on:
  push:
    paths:
      - 'scripts/test_public_search_engines.py'
      - '.github/workflows/test-public-search-engines.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/test_public_search_engines.py
