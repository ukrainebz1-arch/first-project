name: Accounting WKO supplement audit

on:
  push:
    paths:
      - '.github/workflows/accounting-wko-supplement-audit.yml'
      - 'scripts/accounting_wko_supplement_worker.py'
      - 'scripts/accounting_wko_supplement_prepare.py'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download old WKO shortlist and KSW universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source input
          gh api repos/${{ github.repository }}/actions/artifacts/9728867476/zip > /tmp/wko.zip
          unzip -o /tmp/wko.zip -d source/wko >/dev/null
          gh api repos/${{ github.repository }}/actions/artifacts/9731550965/zip > /tmp/ksw.zip
          unzip -o /tmp/ksw.zip -d source/ksw >/dev/null
          test -f source/wko/final_shortlist_20plus_confirmed_or_likely.csv
          test -f source/ksw/ksw_all_groups_qualified.csv
      - name: Build WKO-only candidate chunks
        run: |
          python scripts/accounting_wko_supplement_prepare.py \
            --wko source/wko/final_shortlist_20plus_confirmed_or_likely.csv \
            --ksw source/ksw/ksw_all_groups_qualified.csv \
            --output-dir input --chunks 4
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-wko-supplement-input
          path: input/*
          retention-days: 30

  research:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: accounting-wko-supplement-input
          path: input
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Re-audit WKO-only bookkeeping firms
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          C=$(printf '%02d' "$CHUNK")
          mkdir -p out
          python scripts/accounting_wko_supplement_worker.py \
            --input-csv "input/chunk_${C}.csv" \
            --output-csv "out/chunk_${C}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-wko-supplement-result-${{ matrix.chunk }}
          path: out/*.csv
          retention-days: 30

  merge:
    needs: research
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: accounting-wko-supplement-input
          path: input
      - uses: actions/download-artifact@v4
        with:
          pattern: accounting-wko-supplement-result-*
          path: results
          merge-multiple: true
      - name: Merge supplement results
        run: |
          rm -rf data/accounting/wko_supplement
          mkdir -p data/accounting/wko_supplement/raw
          python - <<'PY'
          import csv,glob,json,os,re
          rows=[]
          for p in sorted(glob.glob('results/*.csv')):
              rows+=list(csv.DictReader(open(p,encoding='utf-8-sig')))
          rows.sort(key=lambda r:r.get('group_name','').lower())
          # Final defensive gate: regulatory/threshold prose must never become company headcount.
          neg=re.compile(r'(?i)(?:nicht mehr als|höchstens|hoechstens|maximal|bis zu)\s+\d{1,4}\s+(?:mitarbeiter|mitarbeitende|beschäftigte|beschaeftigte)|arbeitgeber.{0,120}\d{1,4}.{0,40}(?:mitarbeiter|arbeitnehmer)')
          for r in rows:
              if r.get('agent_verdict','').startswith('CONFIRMED') and neg.search((r.get('agent_source_facts') or '')+' '+(r.get('old_evidence_snippet') or '')):
                  r['agent_verdict']='UNRESOLVED'
                  r['agent_employee_low']=''
                  r['agent_employee_high']=''
                  r['agent_count_scope']='UNKNOWN'
                  r['agent_confidence']='LOW'
                  r['agent_research_summary']='Regulatory/threshold wording detected; no safe company-specific 20+ employee proof.'
                  r['agent_review_note']='REGULATORY_HEADCOUNT_FALSE_POSITIVE_BLOCKED'
          fields=list(rows[0].keys()) if rows else []
          def write(name,rs):
              with open('data/accounting/wko_supplement/'+name,'w',encoding='utf-8-sig',newline='') as f:
                  if fields:
                      w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rs)
          write('all_reaudited.csv',rows)
          confirmed=[r for r in rows if r.get('agent_verdict') in {'CONFIRMED_30_PLUS','CONFIRMED_20_29','CONFIRMED_20_PLUS'}]
          likely=[r for r in rows if r.get('agent_verdict')=='LIKELY_20_PLUS']
          write('confirmed_targets.csv',confirmed);write('likely_targets.csv',likely);write('final_targets.csv',confirmed+likely)
          rejected=[r for r in rows if r.get('accounting_relevance')!='RELEVANT_ACCOUNTING_FIRM'];write('false_positives_not_accounting.csv',rejected)
          s={'reaudited':len(rows),'confirmed':len(confirmed),'likely':len(likely),'not_relevant_false_positives':len(rejected),'unresolved_relevant':sum(r.get('accounting_relevance')=='RELEVANT_ACCOUNTING_FIRM' and r.get('agent_verdict')=='UNRESOLVED' for r in rows),'regulatory_headcount_blocked':sum(r.get('agent_review_note')=='REGULATORY_HEADCOUNT_FALSE_POSITIVE_BLOCKED' for r in rows)}
          json.dump(s,open('data/accounting/wko_supplement/summary.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
          cp input/manifest.json data/accounting/wko_supplement/input_manifest.json
          cp input/excluded_ksw_duplicates.csv data/accounting/wko_supplement/excluded_ksw_duplicates.csv || true
          cp results/*.csv data/accounting/wko_supplement/raw/
      - name: Persist WKO supplement checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add data/accounting/wko_supplement
          git commit -m 'Persist re-audited WKO accounting supplement' || true
          for i in 1 2 3; do git push && break || { git pull --rebase origin main; sleep 2; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-wko-supplement-final
          path: data/accounting/wko_supplement/*
          retention-days: 30
