name: Spedition Stage 2 evidence signal index

on:
  push:
    paths:
      - 'scripts/spedition_stage2_signal_extract.py'
      - '.github/workflows/spedition-stage2-signal-index.yml'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact evidence signal index
        run: python scripts/spedition_stage2_signal_extract.py
      - name: Persist signal checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spedition/stage2_agent_final/evidence_signal_index.csv data/spedition/stage2_agent_final/agent_review_priority.csv data/spedition/stage2_agent_final/signal_index_summary.json
          git commit -m 'Persist Spedition Stage 2 evidence signal index' || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; }
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: spedition-stage2-signal-index
          path: data/spedition/stage2_agent_final/*
          retention-days: 30
