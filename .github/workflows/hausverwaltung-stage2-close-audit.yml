name: Close Hausverwaltung Stage 2 audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hausverwaltung_stage2_close_audit.py'

permissions:
  contents: write

jobs:
  close-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final Stage 2 audit decisions
        run: python scripts/hausverwaltung_stage2_close_audit.py
      - name: Persist final Stage 2 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hausverwaltung/size_agent_first
          git commit -m 'Finalize Hausverwaltung Stage 2 agent-first audit' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
