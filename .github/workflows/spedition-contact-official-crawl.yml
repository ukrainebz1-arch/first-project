name: Spedition contact official crawl
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/spedition_contact_official_crawl.py'
      - 'data/spedition/contacts/targets.csv'
      - 'data/spedition/contacts/target_meta.csv'
      - '.github/workflows/spedition-contact-official-crawl.yml'
permissions:
  contents: write
jobs:
  crawl:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk:
          - {start: 1, end: 12, id: '001_012'}
          - {start: 13, end: 24, id: '013_024'}
          - {start: 25, end: 36, id: '025_036'}
          - {start: 37, end: 48, id: '037_048'}
          - {start: 49, end: 60, id: '049_060'}
          - {start: 61, end: 72, id: '061_072'}
          - {start: 73, end: 84, id: '073_084'}
          - {start: 85, end: 96, id: '085_096'}
          - {start: 97, end: 108, id: '097_108'}
          - {start: 109, end: 118, id: '109_118'}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pypdf
      - name: Crawl official sources
        run: |
          mkdir -p data/spedition/contacts/official_chunks
          python scripts/spedition_contact_official_crawl.py \
            --start ${{ matrix.chunk.start }} --end ${{ matrix.chunk.end }} \
            --out data/spedition/contacts/official_chunks/chunk_${{ matrix.chunk.id }}.csv
      - name: Persist checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILE=data/spedition/contacts/official_chunks/chunk_${{ matrix.chunk.id }}.csv
          git add "$FILE"
          git commit -m "Checkpoint Spedition direct contacts ${{ matrix.chunk.id }}" || exit 0
          for n in 1 2 3 4 5 6; do
            git pull --rebase origin main || { git rebase --abort || true; git pull origin main --no-rebase || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spedition-contact-${{ matrix.chunk.id }}
          path: data/spedition/contacts/official_chunks/chunk_${{ matrix.chunk.id }}.csv
          retention-days: 7
  merge:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge persisted chunks
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import csv,glob,os
          files=sorted(glob.glob('data/spedition/contacts/official_chunks/chunk_*.csv'))
          fields=['no','company','person','contact_type','contact','contact_class','method','source_url','source_title','context']
          rows=[]; seen=set()
          for f in files:
            with open(f,encoding='utf-8-sig',newline='') as h:
              for r in csv.DictReader(h):
                k=(r['no'],r['person'].lower(),r['contact_type'],r['contact'],r['source_url'])
                if k not in seen: seen.add(k);rows.append(r)
          out='data/spedition/contacts/official_hits.csv'
          with open(out,'w',encoding='utf-8-sig',newline='') as h:
            w=csv.DictWriter(h,fieldnames=fields);w.writeheader();w.writerows(rows)
          print('chunks',len(files),'hits',len(rows),'companies',len(set(r['no'] for r in rows)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spedition/contacts/official_hits.csv
          git commit -m 'Merge persistent Spedition official contact hits' || exit 0
          for n in 1 2 3 4 5; do git pull --rebase origin main || true; git push origin HEAD:main && exit 0; sleep $((n*2)); done
          exit 1
