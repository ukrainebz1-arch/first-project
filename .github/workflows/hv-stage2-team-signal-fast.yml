name: Hausverwaltung Stage2 fast team recall
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hausverwaltung_team_signal_fast.py'
      - '.github/workflows/hv-stage2-team-signal-fast.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: mkdir -p data/hausverwaltung/size_agent_first && python scripts/hausverwaltung_team_signal_fast.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hausverwaltung/size_agent_first
          git commit -m 'Checkpoint Hausverwaltung fast team recall probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
