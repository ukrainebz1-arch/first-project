name: Fix Spedition targets CSV
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_spedition_targets_csv.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_spedition_targets_csv.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/spedition/contacts/targets.csv
          git commit -m 'Repair malformed Condor target row 62' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
