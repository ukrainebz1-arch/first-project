name: Compact Stage2 new team candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hv-stage2-new-team-compact.yml'
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compact
        run: |
          python - <<'PY'
          import csv, os
          src='data/hausverwaltung/size_agent_first/team_signal_new_candidates.tsv'
          rows=list(csv.DictReader(open(src,encoding='utf-8'),delimiter='\t'))
          fields=['company_name','website','personal_emails','name_headings','signal']
          with open('data/hausverwaltung/size_agent_first/team_signal_new_compact.tsv','w',encoding='utf-8') as f:
              f.write('\t'.join(fields)+'\n')
              for r in rows:
                  f.write('\t'.join((r.get(k,'') or '').replace('\t',' ').replace('\n',' ') for k in fields)+'\n')
          print('ROWS',len(rows))
          PY
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hausverwaltung/size_agent_first/team_signal_new_compact.tsv
          git commit -m 'Checkpoint compact Hausverwaltung new team candidates' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
