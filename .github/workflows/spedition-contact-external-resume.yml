name: Spedition external direct-contact resume
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/spedition_contact_external_search.py'
      - '.github/workflows/spedition-contact-external-resume.yml'
permissions:
  contents: write
jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk:
          - {start: 1, end: 3, id: '001_003'}
          - {start: 4, end: 6, id: '004_006'}
          - {start: 7, end: 9, id: '007_009'}
          - {start: 10, end: 12, id: '010_012'}
          - {start: 13, end: 15, id: '013_015'}
          - {start: 16, end: 18, id: '016_018'}
          - {start: 19, end: 21, id: '019_021'}
          - {start: 22, end: 24, id: '022_024'}
          - {start: 25, end: 27, id: '025_027'}
          - {start: 28, end: 30, id: '028_030'}
          - {start: 31, end: 33, id: '031_033'}
          - {start: 34, end: 36, id: '034_036'}
          - {start: 37, end: 39, id: '037_039'}
          - {start: 40, end: 42, id: '040_042'}
          - {start: 43, end: 45, id: '043_045'}
          - {start: 46, end: 48, id: '046_048'}
          - {start: 49, end: 51, id: '049_051'}
          - {start: 52, end: 54, id: '052_054'}
          - {start: 55, end: 57, id: '055_057'}
          - {start: 58, end: 60, id: '058_060'}
          - {start: 61, end: 63, id: '061_063'}
          - {start: 64, end: 66, id: '064_066'}
          - {start: 67, end: 69, id: '067_069'}
          - {start: 70, end: 72, id: '070_072'}
          - {start: 73, end: 75, id: '073_075'}
          - {start: 76, end: 78, id: '076_078'}
          - {start: 79, end: 81, id: '079_081'}
          - {start: 82, end: 84, id: '082_084'}
          - {start: 85, end: 87, id: '085_087'}
          - {start: 88, end: 90, id: '088_090'}
          - {start: 91, end: 93, id: '091_093'}
          - {start: 94, end: 96, id: '094_096'}
          - {start: 97, end: 99, id: '097_099'}
          - {start: 100, end: 102, id: '100_102'}
          - {start: 103, end: 105, id: '103_105'}
          - {start: 106, end: 108, id: '106_108'}
          - {start: 109, end: 111, id: '109_111'}
          - {start: 112, end: 114, id: '112_114'}
          - {start: 115, end: 117, id: '115_117'}
          - {start: 118, end: 118, id: '118_118'}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Search external sources
        run: |
          mkdir -p data/spedition/contacts/external_chunks
          python scripts/spedition_contact_external_search.py --start ${{ matrix.chunk.start }} --end ${{ matrix.chunk.end }} --out data/spedition/contacts/external_chunks/resume_${{ matrix.chunk.id }}.csv
      - name: Persist checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FILE=data/spedition/contacts/external_chunks/resume_${{ matrix.chunk.id }}.csv
          git add "$FILE"
          git commit -m "Checkpoint resumed external Spedition search ${{ matrix.chunk.id }}" || exit 0
          for n in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main || { git rebase --abort || true; git pull origin main --no-rebase || true; }
            git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
  merge:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge all external checkpoints
        run: |
          git pull --rebase origin main
          python - <<'PY'
          import csv,glob
          fields=['no','company','person','contact_type','contact','contact_class','method','source_url','source_title','query_family','origin','context']
          rows=[];seen=set(); files=sorted(glob.glob('data/spedition/contacts/external_chunks/*.csv'))
          for f in files:
            with open(f,encoding='utf-8-sig',newline='') as h:
              for r in csv.DictReader(h):
                if not r.get('no'): continue
                k=(r['no'],r['person'].lower(),r['contact_type'],r['contact'].lower(),r['source_url'],r['method'])
                if k not in seen:seen.add(k);rows.append(r)
          out='data/spedition/contacts/external_hits.csv'
          with open(out,'w',encoding='utf-8-sig',newline='') as h:
            w=csv.DictWriter(h,fieldnames=fields);w.writeheader();w.writerows(rows)
          print('checkpoint_files',len(files),'hits',len(rows),'companies',len(set(r['no'] for r in rows)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/spedition/contacts/external_hits.csv
          git commit -m 'Merge resumed external Spedition contact enrichment' || exit 0
          for n in 1 2 3 4 5; do git pull --rebase origin main || true; git push origin HEAD:main && exit 0; sleep $((n*2)); done
          exit 1
