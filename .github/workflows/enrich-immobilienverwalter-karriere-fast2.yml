name: Enrich Immobilienverwalter karriere fast2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'enrich_immobilienverwalter_karriere_fast2.py'
      - '.github/workflows/enrich-immobilienverwalter-karriere-fast2.yml'
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 rapidfuzz
      - run: python prepare_immobilienverwalter_size_input.py
      - name: Cached indexed karriere.at matching
        env:
          WKO_CSV: iv_size_input/iv_size_input.csv
          OUTDIR: iv_karriere_fast2
        run: python enrich_immobilienverwalter_karriere_fast2.py
      - uses: actions/upload-artifact@v4
        with:
          name: iv-size-karriere-fast2
          path: iv_karriere_fast2/
          if-no-files-found: error
          retention-days: 7
