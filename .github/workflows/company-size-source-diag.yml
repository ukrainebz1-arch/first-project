name: Company size source diagnostics
on:
  push:
    paths:
      - company_size_source_diag.py
      - .github/workflows/company-size-source-diag.yml
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright==1.54.0
      - run: python -m playwright install --with-deps chromium
      - run: python company_size_source_diag.py
