name: Hausverwaltung External Size Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/hausverwaltung_size_external_search.py'
      - '.github/workflows/hausverwaltung-size-external-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pypdf
      - name: Search first 30 canonical companies
        run: python scripts/hausverwaltung_size_external_search.py --start 1 --end 30 --out smoke/evidence.csv --progress-out smoke/progress.csv
      - uses: actions/upload-artifact@v4
        with:
          name: hausverwaltung-size-external-smoke
          path: smoke/
          if-no-files-found: error
          retention-days: 7
